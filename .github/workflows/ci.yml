# PR and main-branch CI — lint and test only (no secrets, no PyPI OIDC).
# Lint/test steps live in reusable-test.yml (issue #17). PR CI matrices Python
# versions; publish stays single-version as a release gate (see docs/TESTING.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}
      pip-audit: true

  skillware-live:
    name: Skillware registry (live)
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"
      skillware: true

  # Stable check name for branch protection (matrix cells are "Python 3.xx").
  ci-ok:
    name: lint-test
    needs: [lint-test, skillware-live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Python matrix succeeded
        run: |
          test "${{ needs.lint-test.result }}" = "success"
          test "${{ needs.skillware-live.result }}" = "success"

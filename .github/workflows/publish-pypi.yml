# Publish aura-harness to PyPI when a GitHub Release is published (or manual dispatch).
# Do not also trigger on tag push — publishing a Release for a v* tag would run twice
# and the second upload fails with PyPI "File already exists" (400).
#
# Setup (one-time on PyPI):
#   A) Trusted publishing (recommended): https://docs.pypi.org/trusted-publishers/
#      Add publisher: owner ARPAHLS, repo aura, workflow publish-pypi.yml
#   B) Or add secret PYPI_API_TOKEN (pypi-...) in GitHub repo settings
#
# Before tagging: bump version in pyproject.toml and aura/__init__.py to match the tag (e.g. v0.3.0).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Same lint/test as PR CI via reusable-test.yml (Python 3.12 release gate).
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aura-harness/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        # Optional token auth — uncomment if not using PyPI trusted publishing:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
